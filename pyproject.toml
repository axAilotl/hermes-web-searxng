[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-web-searxng"
version = "0.1.1"
description = "Standalone SearXNG search plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "axAilotl" }]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
]

[project.entry-points."hermes_agent.plugins"]
hermes-web-searxng = "hermes_web_searxng"

[project.urls]
Repository = "https://github.com/axAilotl/hermes-web-searxng"
Issues = "https://github.com/axAilotl/hermes-web-searxng/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "ruff>=0.9,<1", "PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["hermes_web_searxng"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
