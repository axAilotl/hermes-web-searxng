name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: hermes-web-searxng
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Hermes and plugin test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./hermes-agent
          python -m pip install -e './hermes-web-searxng[dev]'
      - name: Test
        working-directory: hermes-web-searxng
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-plugin-test
        run: pytest -q
      - name: Check Hermes plugin compatibility
        working-directory: hermes-web-searxng
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-plugin-check
        run: |
          hermes plugins doctor . --ci
          hermes plugins validate .
      - name: Lint
        working-directory: hermes-web-searxng
        run: ruff check .
