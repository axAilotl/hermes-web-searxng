name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            hermes: v0.23.0
          - os: windows-latest
            hermes: v0.23.0
          - os: macos-latest
            hermes: v0.23.0
          - os: ubuntu-latest
            hermes: main
    runs-on: ${{ matrix.os }}
    env:
      HERMES_HOME: ${{ github.workspace }}/.hermes-plugin-test
    defaults:
      run:
        shell: bash
        working-directory: plugin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: plugin
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"
      - name: Install plugin and isolated host test harness
        run: |
          python -m pip install --no-deps -e ../hermes-agent
          python -m pip install -r tests/requirements-host.txt '.[dev]' build
      - name: Test and lint
        run: |
          python -m pytest -q
          ruff check .
      - name: Validate native plugin
        run: |
          hermes plugins doctor . --ci
          hermes plugins validate .
      - name: Build and verify installed wheel
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -I tests/smoke_installed.py
